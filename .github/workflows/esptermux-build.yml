name: ESPTermux APK (experimental)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
        run: ./gradlew assembleDebug --stacktrace
      - name: Audit bootstrap prefix compatibility
        if: always()
        run: |
          python3 scripts/audit_bootstrap.py app/src/main/cpp/bootstrap-*.zip | tee bootstrap-audit.txt
      - name: Verify bootstrap is independent of original Termux
        run: python3 scripts/audit_bootstrap.py --require-relocatable app/src/main/cpp/bootstrap-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esptermux-diagnostic-build-NOT-READY
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            bootstrap-audit.txt
